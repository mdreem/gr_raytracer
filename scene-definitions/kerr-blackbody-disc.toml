# Gallery blackbody-disc scene: Novikov-Thorne blackbody disc against the
# M25 star field (downloaded by images/create-gallery-images.sh). The
# script substitutes `a`, `temperature` and inner_radius per shot: a hot
# golden pair at a = 0.499 and a cool red pair at a = 0.4995 (essentially
# extremal; exactly a = M is degenerate because the ISCO coincides with
# the photon orbit, where no timelike circular orbit exists).
celestial_temperature = 0.0

[celestial_texture.Bitmap]
beaming_exponent = 3.0
path = "resources/tmp/Messier_object_025.jpg"

[geometry_type.KerrBL]
radius = 1.0
a = 0.499
horizon_epsilon = 1e-4

[[objects]]

[objects.Disc]
inner_radius = 0.63
outer_radius = 12.0
temperature = 8000.0

[objects.Disc.texture.BlackBody]
beaming_exponent = 0.0
