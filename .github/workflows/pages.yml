name: Redirect the old gallery URLs

# The gallery moved to its own repository so that cloning this one does not
# pull a quarter of a gigabyte of renders:
#
#   https://dreevich.dev/gr_raytracer-gallery/   (mdreem/gr_raytracer-gallery)
#
# This workflow keeps the old paths alive. It publishes nothing but redirects.

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GALLERY: https://dreevich.dev/gr_raytracer-gallery
    steps:
      - name: Generate redirects
        run: |
          mkdir -p _site
          emit() {  # emit <old path> <new path under the gallery>
            cat > "_site/$1" <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Moved</title>
            <link rel="canonical" href="${GALLERY}$2">
            <meta http-equiv="refresh" content="0; url=${GALLERY}$2">
          </head>
          <body>
            <p>The gr_raytracer gallery moved to
            <a href="${GALLERY}$2">${GALLERY}$2</a>.</p>
          </body>
          </html>
          HTML
          }
          emit index.html                        /
          emit schwarzschild.html                /schwarzschild/
          emit kerr.html                         /kerr/
          emit naked-singularity.html            /naked-singularity/
          emit showcase.html                     /showcase/
          emit starfield-gallery-recipes.html    /recipes/starfield/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
