[project]
name = "gr-raytracer-python-tools"
version = "0.1.0"
description = "Python helper scripts for gr_raytracer"
readme = "scripts/Readme.md"
requires-python = ">=3.11"
dependencies = [
    "manim>=0.19.0",
    "matplotlib>=3.10.0",
    "numpy>=2.3.0",
    "pandas>=2.3.0",
    "pillow>=11.3.0",
    "scipy>=1.16.0",
]

[tool.uv]
package = false

# Opt-in dependencies for the Gaia DR3 star-catalogue helper
# (scripts/gaia/). Kept out of the default dependency set so that the
# heavy astro stack is only pulled in when actually downloading a catalog.
# Run with:  uv run --group gaia scripts/gaia/download.py download ...
[dependency-groups]
gaia = [
    "astroquery>=0.4.7",
    "astropy>=6.0",
    "pyarrow>=15.0",
]
